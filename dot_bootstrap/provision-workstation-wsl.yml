- name: Workstation setup (WSL)
  hosts: localhost
  connection: local
  gather_facts: true

  tasks:
    - name: Get my user
      ansible.builtin.set_fact:
        remote_regular_user: "{{ ansible_facts['env'].get('SUDO_USER') or ansible_facts['user_id'] }}"

    # ------------------------------------------------------------------------
    # Install packages
    # ------------------------------------------------------------------------

    - name: Add GitHub CLI apt key
      become: true
      ansible.builtin.get_url:
        url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
        dest: /usr/share/keyrings/githubcli-archive-keyring.gpg
        mode: "0644"

    - name: Add GitHub CLI apt repository
      become: true
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ ansible_facts['architecture'] }} signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main"
        state: present
        filename: github-cli

    - name: Install packages
      become: true
      ansible.builtin.apt:
        name:
          - fontconfig
          - git
          - gh
          - htop
          # kitty has no Windows build; it runs from WSL as a normal Windows
          # window via WSLg (Windows 11) and gets a Start menu entry.
          - kitty
          - tmux
          - vim
          - unzip
        state: present
        update_cache: true

    # ------------------------------------------------------------------------
    # Install fonts
    # ------------------------------------------------------------------------
    # kitty runs inside WSL, so it needs the font in Linux; the Windows-side
    # install in provision-workstation-windows.ps1 is not visible to it.

    - name: Ensure fonts directory
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.fonts"
        state: directory
        mode: "0755"

    # find (not `ls` + ignore_errors) so a missing font is a normal result,
    # not a red error on every fresh machine.
    - name: Check if Jetbrains Mono exists
      ansible.builtin.find:
        paths: "{{ ansible_facts['env']['HOME'] }}/.fonts"
        patterns: "JetBrainsMonoNerd*FontMono*"
      register: jetbrains_mono

    - name: Download Jetbrains Mono
      when: jetbrains_mono.matched == 0
      ansible.builtin.unarchive:
        src: https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/JetBrainsMono.zip
        dest: "{{ ansible_facts['env']['HOME'] }}/.fonts/"
        remote_src: true
        mode: "0644"

    - name: Refresh font cache
      when: jetbrains_mono.matched == 0
      ansible.builtin.command: "fc-cache -f {{ ansible_facts['env']['HOME'] }}/.fonts"
      changed_when: true

    # ------------------------------------------------------------------------
    # Install Claude Code
    # ------------------------------------------------------------------------

    - name: Check if Claude Code is installed
      ansible.builtin.command: which claude
      register: claude_installed
      ignore_errors: true
      changed_when: false

    - name: Install Claude Code
      ansible.builtin.shell: curl -fsSL https://claude.ai/install.sh | bash
      when: claude_installed is failed
