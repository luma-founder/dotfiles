- name: Workstation setup (Linux)
  hosts: localhost
  connection: local
  gather_facts: true

  tasks:
    - name: Get my user
      ansible.builtin.set_fact:
        remote_regular_user: "{{ ansible_facts['env'].get('SUDO_USER') or ansible_facts['user_id'] }}"

    # ------------------------------------------------------------------------
    # Install packages
    # ------------------------------------------------------------------------

    - name: Add GitHub CLI apt key (Debian/Ubuntu)
      when: ansible_facts['os_family'] == "Debian"
      become: true
      ansible.builtin.get_url:
        url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
        dest: /usr/share/keyrings/githubcli-archive-keyring.gpg
        mode: "0644"

    # apt names architectures differently from Ansible (amd64 vs x86_64,
    # arm64 vs aarch64). With arch=x86_64 apt silently skips the repo and gh
    # comes from the distro's older package instead, so ask dpkg.
    - name: Get Debian architecture (Debian/Ubuntu)
      when: ansible_facts['os_family'] == "Debian"
      ansible.builtin.command: dpkg --print-architecture
      register: deb_arch
      changed_when: false

    # Machines provisioned before this fix have a dead arch=x86_64 line.
    - name: Remove GitHub CLI apt line with wrong architecture (Debian/Ubuntu)
      when: ansible_facts['os_family'] == "Debian"
      become: true
      ansible.builtin.lineinfile:
        path: /etc/apt/sources.list.d/github-cli.list
        regexp: 'arch=(?!{{ deb_arch.stdout }}\b)'
        state: absent
      failed_when: false

    - name: Add GitHub CLI apt repository (Debian/Ubuntu)
      when: ansible_facts['os_family'] == "Debian"
      become: true
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ deb_arch.stdout }} signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main"
        state: present
        filename: github-cli

    - name: Install packages (Debian/Ubuntu)
      when: ansible_facts['os_family'] == "Debian"
      become: true
      ansible.builtin.apt:
        name:
          - fontconfig
          - fzf
          - git
          - gh
          - htop
          - tmux
          - vim
          - unzip
        state: present
        update_cache: true

    - name: Install packages (Fedora)
      when: ansible_facts['distribution'] == "Fedora"
      become: true
      ansible.builtin.dnf:
        name:
          - fontconfig
          - fzf
          - git
          - gh
          - htop
          - tmux
          - vim
        state: present

    - name: Install yq (mikefarah, Linux)
      become: true
      ansible.builtin.get_url:
        url: "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
        dest: /usr/local/bin/yq
        mode: "0755"

    # ------------------------------------------------------------------------
    # Install fonts
    # ------------------------------------------------------------------------

    # No become: everything here is in $HOME, so it is already owned by the
    # user running the playbook.
    - name: Ensure fonts directory
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.fonts"
        state: directory
        mode: "0755"

    # find (not `ls` + ignore_errors) so a missing font is a normal result,
    # not a red error on every fresh machine.
    - name: Check if Jetbrains Mono exists
      ansible.builtin.find:
        paths: "{{ ansible_facts['env']['HOME'] }}/.fonts"
        patterns: "JetBrainsMonoNerd*FontMono*"
      register: jetbrains_mono

    - name: Download Jetbrains Mono
      when: jetbrains_mono.matched == 0
      ansible.builtin.unarchive:
        src: https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/JetBrainsMono.zip
        dest: "{{ ansible_facts['env']['HOME'] }}/.fonts/"
        remote_src: true
        mode: "0644"

    - name: Refresh font cache
      when: jetbrains_mono.matched == 0
      ansible.builtin.command: "fc-cache -f {{ ansible_facts['env']['HOME'] }}/.fonts"
      changed_when: true

    # ------------------------------------------------------------------------
    # Install Claude Code
    # ------------------------------------------------------------------------

    - name: Check if Claude Code is installed
      ansible.builtin.command: which claude
      register: claude_installed
      ignore_errors: true
      changed_when: false

    - name: Install Claude Code
      ansible.builtin.shell: curl -fsSL https://claude.ai/install.sh | bash
      when: claude_installed is failed
